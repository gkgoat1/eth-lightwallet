name: CI

on:
  push:
    branches: [modernize, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # No lockfile exists yet (gitignored historically); install is pinned
      # via .npmrc save-exact going forward.
      - run: npm install --ignore-scripts --no-audit --no-fund

      - run: npm run typecheck

      # Ported vitest suites against the frozen legacy/ oracle.
      - run: npm test

      # Original mocha harness against lib/ (regression floor until the old
      # sources are removed in a later phase).
      - run: npm run test:legacy-harness

      # Build + packed-tarball smoke test (CJS require, ESM import, types
      # under node16 + bundler, golden address pin).
      - run: npm run smoke
